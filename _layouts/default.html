<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="site-title">{{ site.title }}</div>
        <nav>
          <ul>
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li><a href="{{ '/resume.html' | relative_url }}">Curriculum Vitae</a></li>
            <li><a href="{{ '/publications.html' | relative_url }}">Publications</a></li>
            <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>
  </body>
</html>
